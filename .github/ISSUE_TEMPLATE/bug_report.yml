name: Bug report
description: Something in Glimmervoid does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start glimmervoid
        2. Add a session for a git repo
        3. ...
    validations:
      required: true
  - type: input
    id: glimmervoid-version
    attributes:
      label: Glimmervoid version
      description: Output of `glimmervoid --version`.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: glimmervoid doctor output
      description: Output of `glimmervoid doctor`. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: node-npm
    attributes:
      label: Node and npm versions
      description: Output of `node --version` and `npm --version`.
    validations:
      required: true
  - type: input
    id: agent-cli
    attributes:
      label: Agent CLI and version
      description: For example the output of `claude --version`, `codex --version` or `grok --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server output
      description: Relevant lines from the terminal running glimmervoid.
      render: text
