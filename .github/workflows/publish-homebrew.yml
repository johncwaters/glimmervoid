name: publish-homebrew

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-homebrew-formula:
    runs-on: "ubuntu-24.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ inputs.plan }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
      HOMEBREW_DESC: "Supervise terminal coding agents on a shared whiteboard"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: "johncwaters/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew update

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)
            formula="Formula/${filename}"

            sed -i "s/^  desc \".*\"$/  desc \"${HOMEBREW_DESC}\"/" "$formula"
            sed -i '$d' "$formula"
            printf '\n  test do\n    assert_match version.to_s, shell_output("#{bin}/%s --version")\n  end\nend\n' "$name" >> "$formula"
            ruby - "$formula" <<'RUBY'
          path = ARGV.fetch(0)
          formula = File.read(path)
          triple_definition = /^  def target_triple\n(?<body>.*?)\n\n    (?<value>"[^\n]+")\n  end\n\n/m
          aliases_definition = /^  def install_binary_aliases!\n(?<body>.*?)\n  end\n\n/m
          aliases_call = "    install_binary_aliases!\n"
          triple = formula.match(triple_definition) or abort("#{path}: def target_triple not in the expected shape")
          aliases = formula.match(aliases_definition) or abort("#{path}: def install_binary_aliases! not in the expected shape")
          formula.include?(aliases_call) or abort("#{path}: install_binary_aliases! call not found")
          inlined = "#{triple[:body]}\n    target_triple = #{triple[:value]}\n#{aliases[:body]}\n"
          formula = formula.sub(triple_definition, "").sub(aliases_definition, "").sub(aliases_call) { inlined }
          File.write(path, formula)
          RUBY
            brew style --except-cops FormulaAudit/Homepage,FormulaAuditStrict --fix "$formula"

            git add "$formula"
            git commit -m "${name} ${version}"
          done
          git push
