name: test

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # npm ci already built dist/ through `prepare`; this step is here so a broken build fails under
      # its own name instead of surfacing as a mystery in the packaging job below.
      - run: npm run build
      - run: npm test
      # npm ci blocks node-pty's install scripts (npm 11.17+ default), so only this leg tests the documented global install where they run and the native module compiles.
      - name: packaged global install
        shell: bash
        run: |
          TARBALL=$(npm pack | tail -1)
          npx --yes npm@12 install -g "./$TARBALL" --allow-scripts=node-pty
          glimmervoid doctor > doctor.log
          cat doctor.log
          # doctor reports a broken native module and still exits 0, so this line is the real gate.
          grep -q "loads OK" doctor.log

  pack:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p "$RUNNER_TEMP/tarball" && npm pack --pack-destination "$RUNNER_TEMP/tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error
          retention-days: 1

  # npm ci cannot run on win32: @posthog/coherence declares os darwin,linux, so this job installs the Linux-built tarball users get.
  windows:
    needs: pack
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: tarball
      - name: packaged global install
        shell: bash
        run: |
          npx --yes npm@12 install -g ./tarball/*.tgz --allow-scripts=node-pty
          glimmervoid doctor > doctor.log
          cat doctor.log
          grep -q "loads OK" doctor.log
      - name: smoke start
        shell: pwsh
        run: |
          $portProbe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $portProbe.Start()
          $port = $portProbe.LocalEndpoint.Port
          $portProbe.Stop()
          $launcher = (Get-Command glimmervoid.cmd).Source
          $server = Start-Process -FilePath $launcher -ArgumentList '--no-open', '--port', $port -PassThru -NoNewWindow -RedirectStandardOutput server.log -RedirectStandardError server-error.log
          $deadline = (Get-Date).AddSeconds(60)
          $isDashboardServed = $false
          while (-not $isDashboardServed -and -not $server.HasExited -and (Get-Date) -lt $deadline) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5
              $isDashboardServed = $response.StatusCode -eq 200
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if (-not $server.HasExited) { taskkill /T /F /PID $server.Id | Out-Null }
          Get-Content server.log, server-error.log
          if (-not $isDashboardServed) { throw "glimmervoid did not serve http://127.0.0.1:$port/ with 200 within 60 s" }
          exit 0

  site:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix site
      - run: npm run build --prefix site
