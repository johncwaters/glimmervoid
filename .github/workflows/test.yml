name: test

# Release-only by design: Actions minutes are limited, so scripts/release.ts dispatches this before tagging; add no push or pull_request trigger.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # npm ci already built dist/ through `prepare`; this step is here so a broken build fails under
      # its own name instead of surfacing as a mystery in the packaging job below.
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e -- --all
      # npm ci blocks node-pty's install scripts (npm 11.17+ default), so only this leg tests the documented global install where they run and the native module compiles.
      - name: packaged global install
        shell: bash
        run: |
          TARBALL=$(npm pack | tail -1)
          npx --yes npm@12 install -g "./$TARBALL" --allow-scripts=node-pty,ffmpeg-static
          glimmervoid doctor | tee doctor.log
          grep -Eq "ffmpeg +loads OK" doctor.log

  pack:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p "$RUNNER_TEMP/tarball" && npm pack --pack-destination "$RUNNER_TEMP/tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: ${{ runner.temp }}/tarball/*.tgz
          if-no-files-found: error
          retention-days: 1

  # npm ci cannot run on win32: @posthog/coherence declares os darwin,linux, so this job installs the Linux-built tarball users get.
  windows:
    needs: pack
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: tarball
      - name: packaged global install
        shell: bash
        run: |
          npx --yes npm@12 install -g ./tarball/*.tgz --allow-scripts=node-pty,ffmpeg-static
          glimmervoid doctor | tee doctor.log
          grep -Eq "ffmpeg +loads OK" doctor.log
      - name: smoke start
        shell: pwsh
        run: |
          $launcher = (Get-Command glimmervoid.cmd).Source
          function Invoke-SmokeStart {
            $portProbe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $portProbe.Start()
            $port = $portProbe.LocalEndpoint.Port
            $portProbe.Stop()
            $server = Start-Process -FilePath $launcher -ArgumentList '--no-open', '--port', $port -PassThru -NoNewWindow -RedirectStandardOutput server.log -RedirectStandardError server-error.log
            $deadline = (Get-Date).AddSeconds(60)
            $isDashboardServed = $false
            while (-not $isDashboardServed -and -not $server.HasExited -and (Get-Date) -lt $deadline) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5
                $isDashboardServed = $response.StatusCode -eq 200
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            $hasServerExitedOnItsOwn = $server.HasExited
            if (-not $hasServerExitedOnItsOwn) { taskkill /T /F /PID $server.Id | Out-Null }
            Get-Content server.log, server-error.log | Write-Host
            if ($isDashboardServed) { return 'served' }
            $isPortTaken = $hasServerExitedOnItsOwn -and (Select-String -Path server-error.log -Pattern "^Port $port is already in use" -Quiet)
            if ($isPortTaken) { return 'port-taken' }
            throw "glimmervoid did not serve http://127.0.0.1:$port/ with 200 within 60 s"
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if ((Invoke-SmokeStart) -eq 'served') { exit 0 }
            Write-Host "attempt $attempt lost its probed port to another process; probing a fresh one"
          }
          throw "every one of 3 probed ports was taken before glimmervoid bound it"

  site:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix site
      - run: npm run build --prefix site
