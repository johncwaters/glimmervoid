name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: tag matches package.json version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$PACKAGE_VERSION"
            exit 1
          fi
      - name: tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main"
            exit 1
          fi
      - name: skip when this version is already on npm
        id: registry
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "glimmervoid@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "glimmervoid@$PACKAGE_VERSION is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"
      - if: steps.registry.outputs.published == 'false'
        run: npm ci
      - if: steps.registry.outputs.published == 'false'
        run: npm run build
      - if: steps.registry.outputs.published == 'false'
        run: env -u GLIMMERVOID_POSTHOG_API_KEY -u GLIMMERVOID_TELEGRAM_BOT_TOKEN npm test
      - name: check for the PostHog release key
        id: posthog-key
        if: steps.registry.outputs.published == 'false'
        shell: bash
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        run: |
          if [ -n "$POSTHOG_CLI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: resolve the PostHog release
        id: posthog-release
        if: steps.posthog-key.outputs.configured == 'true'
        continue-on-error: true
        uses: PostHog/resolve-release@52d3bea6f86a713545874057b7d4bfebb6b5f367 # v1.0.0
        with:
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: '640352'
          release-name: glimmervoid
          release-version: ${{ steps.registry.outputs.version }}
      - name: ship the PostHog release id in package.json
        if: steps.posthog-release.outputs.release-id != ''
        continue-on-error: true
        shell: bash
        env:
          POSTHOG_RELEASE_ID: ${{ steps.posthog-release.outputs.release-id }}
        run: npm pkg set "glimmervoid.posthogReleaseId=$POSTHOG_RELEASE_ID"
      - if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
      - name: annotate the release in PostHog
        if: steps.posthog-key.outputs.configured == 'true'
        continue-on-error: true
        shell: bash
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          PACKAGE_VERSION: ${{ steps.registry.outputs.version }}
        run: |
          DATE_MARKER=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "https://us.posthog.com/api/projects/640352/annotations/" \
            -H "Authorization: Bearer $POSTHOG_CLI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"v$PACKAGE_VERSION released\",\"date_marker\":\"$DATE_MARKER\",\"scope\":\"project\"}"
