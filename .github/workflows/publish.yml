name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: tag matches package.json version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$PACKAGE_VERSION"
            exit 1
          fi
      - name: tagged commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main"
            exit 1
          fi
      - name: skip when this version is already on npm
        id: registry
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "glimmervoid@$PACKAGE_VERSION" version > /dev/null 2>&1; then
            echo "glimmervoid@$PACKAGE_VERSION is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"
      - if: steps.registry.outputs.published == 'false'
        run: npm ci
      - if: steps.registry.outputs.published == 'false'
        run: npm run build
      - if: steps.registry.outputs.published == 'false'
        run: env -u GLIMMERVOID_POSTHOG_API_KEY -u GLIMMERVOID_TELEGRAM_BOT_TOKEN npm test
      - if: steps.registry.outputs.published == 'false'
        run: npm publish --provenance --access public
