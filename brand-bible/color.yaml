tokens:
  state-monitoring:
    value: "#90b2eb"
    role: state
    name: Monitoring
    use: A turn ended while background tasks still run.
  state-running:
    value: "#a0de93"
    role: state
    name: Working
    use: Working.
  state-waiting:
    value: "#fd9320"
    role: state
    name: Needs Input
    use: Needs input, needs attention, setup required.
  state-failed:
    value: "#f5626a"
    role: state
    name: Failed
    use: Failed, disconnected, destructive; also the red pen ink of the doc editor's Markup mode, the one decorative use.
  state-initializing:
    value: "#9c8895"
    role: state
    name: Starting (initializing)
    use: Unused since worktree setup displays as Starting.
  state-idle:
    value: "#848275"
    role: state
    name: Idle
    use: Idle.
  bg:
    value: "#0f0e11"
    role: surface
    name: Graphite
    use: Base canvas behind everything.
  bg-card:
    value: "#1a191d"
    role: surface
    name: Card Graphite
    use: Card and panel fills and the terminal pane.
  bg-header:
    value: "#141317"
    role: surface
    name: Header Graphite
    use: The sticky header bar.
  bg-surface:
    value: "#201e23"
    role: surface
    name: Inset Graphite
    use: Inset surfaces and inputs.
  border:
    value: "#39373e"
    role: border
    name: Rule
    use: Component edges.
  border-dim:
    value: "#2a282e"
    role: border
    name: Dim Rule
    use: Quiet internal dividers.
  border-hover:
    value: "#49464f"
    role: border
    name: Lifted Rule
    use: "Hover and elevated surfaces: menus, tooltips, dialogs."
  text:
    value: "#cfccd5"
    role: text
    name: Pewter
    use: Default body text.
  text-dim:
    value: "#afacb7"
    role: text
    name: Ash
    use: Secondary text and descriptions.
  text-head:
    value: "#efedf3"
    role: text
    name: Paper
    use: Headings and emphasized text.
  text-muted:
    value: "#9d99a5"
    role: text
    name: Faint Ash
    use: Tertiary labels and captions, the quietest legible text.
  accent:
    value: "#b39edc"
    role: brand
    name: Muted Lavender
    use: "The one accent: primary actions, selection, focus rings, the active tab underline, the wordmark glyph."
  accent-dim:
    value: "#745f98"
    role: brand
    name: Dusk Plum
    use: Accent borders, CTA strokes and pulse low points where full accent would shout.
  state-done:
    value: "#7f979f"
    role: state
    name: Exited
    use: "Exited: the agent process ended."
  state-starting:
    value: "#d1a7c2"
    role: state
    name: Starting
    use: Starting, including worktree preparation.
  state-complete:
    value: "#46cdb7"
    role: state
    name: Complete
    use: A finished turn not yet looked at; also success such as merged branches and passing checks.
  state-dormant:
    value: "#56535d"
    role: state
    name: Dormant Graphite
    use: A session not started yet.
  perms-warn:
    value: "#d98941"
    role: state
    name: Permissions Amber
    use: The SANE YOLO chip on sessions spawned with skipped permission prompts.
