tokens:
  state-monitoring:
    value: "#60a5fa"
    role: state
    name: Signal Sky
    use: A turn ended while background tasks still run.
  state-running:
    value: "#22c55e"
    role: state
    name: Signal Green
    use: Working.
  state-waiting:
    value: "#f59e0b"
    role: state
    name: Signal Amber
    use: Needs input, needs attention, setup required.
  state-failed:
    value: "#ef4444"
    role: state
    name: Signal Red
    use: Failed, disconnected, destructive.
  state-initializing:
    value: "#6b7280"
    role: state
    name: Signal Slate
    use: Unused since worktree setup displays as Starting.
  state-idle:
    value: "#eab308"
    role: state
    name: Signal Gold
    use: Idle.
  bg:
    value: "#0a0810"
    role: surface
    name: Near-Black Violet
    use: Base canvas behind everything.
  bg-card:
    value: "#100e18"
    role: surface
    name: Ink Violet
    use: Card and panel fills and the terminal pane.
  bg-header:
    value: "#0c0a14"
    role: surface
    name: Shadow Violet
    use: The sticky header bar.
  bg-surface:
    value: "#16122a"
    role: surface
    name: Deep Violet Slate
    use: Inset surfaces and inputs.
  border:
    value: "#2a2440"
    role: border
    name: Violet Border
    use: Component edges.
  border-dim:
    value: "#1e1a32"
    role: border
    name: Dim Violet Border
    use: Quiet internal dividers.
  border-hover:
    value: "#3e3660"
    role: border
    name: Lifted Violet Border
    use: "Hover and elevated surfaces: menus, tooltips, dialogs."
  text:
    value: "#c8c0e0"
    role: text
    name: Soft Lavender Grey
    use: Default body text.
  text-dim:
    value: "#8d82b9"
    role: text
    name: Muted Lavender
    use: Secondary text and descriptions.
  text-head:
    value: "#e8e0ff"
    role: text
    name: Bright Lavender White
    use: Headings and emphasized text.
  text-muted:
    value: "#8579b1"
    role: text
    name: Faint Lavender
    use: Tertiary labels and captions, the quietest legible text.
  accent:
    value: "#c084fc"
    role: brand
    name: Iridescent Orchid
    use: "The one accent: primary actions, selection, focus rings, the active tab underline, the wordmark glyph."
  accent-dim:
    value: "#9656d6"
    role: brand
    name: Deep Orchid
    use: Accent borders, CTA strokes and pulse low points where full accent would shout.
  state-done:
    value: "#67e8f9"
    role: state
    name: Signal Cyan
    use: "Exited: the agent process ended."
  state-starting:
    value: "#f472b6"
    role: state
    name: Signal Pink
    use: Starting, including worktree preparation.
  state-complete:
    value: "#34d399"
    role: state
    name: Signal Emerald
    use: A finished turn not yet looked at; also success such as merged branches and passing checks.
  state-dormant:
    value: "#5a527a"
    role: state
    name: Dormant Violet
    use: A session not started yet.
  perms-warn:
    value: "#d97706"
    role: state
    name: Permissions Amber
    use: The SANE YOLO chip on sessions spawned with skipped permission prompts.
