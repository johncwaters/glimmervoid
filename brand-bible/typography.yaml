families:
  - id: mono
    family: CommitMono
    files:
      - public/fonts/commit-mono-400-regular-core.woff2
      - public/fonts/commit-mono-400-regular.woff2
      - public/fonts/commit-mono-700-regular-core.woff2
      - public/fonts/commit-mono-700-regular.woff2
    license: SIL OFL 1.1 (assets/fonts/CommitMono-OFL.txt)
    fallback: [Cascadia Code, Fira Code, Consolas, Menlo, monospace]
  - id: doc
    family: IBM Plex Sans
    files:
      - public/fonts/ibm-plex-sans-latin.woff2
    license: SIL OFL 1.1 (assets/fonts/IBMPlexSans-OFL.txt)
    fallback: [Segoe UI, system-ui, sans-serif]
  - id: board
    family: ComicMono
    files:
      - public/fonts/comic-mono-400.woff2
      - public/fonts/comic-mono-700.woff2
    license: MIT (assets/fonts/ComicMono-LICENSE.txt)
    fallback: [CommitMono, monospace]
scale:
  meta: { token: type-meta, sizePx: 12, lineHeight: 1.55, weight: 400, trackingEm: 0, case: none }
  body: { token: type-body, sizePx: 14, lineHeight: 1.5, weight: 400, trackingEm: 0, case: none }
  title: { token: type-title, sizePx: 16, lineHeight: 1.3, weight: 700, trackingEm: 0, case: none }
  display: { token: type-display, sizePx: 20, lineHeight: 1.2, weight: 700, trackingEm: 0.1, case: uppercase }
  doc-h1: { token: type-doc-h1, sizePx: 28, lineHeight: 1.25, weight: 700, trackingEm: 0, case: none }
  doc-h2: { token: type-doc-h2, sizePx: 22, lineHeight: 1.3, weight: 700, trackingEm: 0, case: none }
  doc-h3: { token: type-doc-h3, sizePx: 18, lineHeight: 1.35, weight: 700, trackingEm: 0, case: none }
  doc-body: { token: type-doc-body, sizePx: 16, lineHeight: 1.75, weight: 400, trackingEm: 0, case: none }
weights: [400, 700]
minSizePx: 12
features:
  calt: on
literalSizesAllowedIn:
  - public/style.css
  - public/tailwind.css
  - public/index.html
  - server/remote-auth.ts
  - cloud/doorman/host-page.ts
