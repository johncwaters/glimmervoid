mark:
  file: shared/brand-mark.ts
  viewBox: -4 -4 108 108
  pathData:
    - M33 29L50 12L67 29
    - M71 33L88 50L71 67
    - M67 71L50 88L33 71
    - M29 67L12 50L29 33
    - M50 39L61 50L50 61L39 50Z
variants:
  - id: mark-only
    file: shared/brand-mark.ts
    use: The mark alone wherever the lockup does not fit; the favicon and app icon are this mark exported, and the dashboard loading and shutdown screens set GLIMMERVOID under it.
  - id: horizontal
    file: site/src/components/Wordmark.astro
    use: The lockup, the mark left of GLIMMERVOID in uppercase CommitMono 700, 0.1em tracking, one solid ink; the dashboard header (public/index.html), the site nav and the site footer.
  - id: stacked
    file: site/src/components/Wordmark.astro
    use: GLIMMER over VOID in one solid ink with a violet diamond after VOID, 0.06em tracking; display only, the site hero and the link image (marketing/social/templates/link-card.html), never set below 48px. For Glimmervoid Cloud (productName) the diamond sits after VOID and CLOUD follows at half size, regular weight, centred on the diamond, as the /next/ Cloud section sets it.
  - id: favicon
    file: public/favicon.svg
    use: The mark in the browser tab; the light turns amber or red when a session needs the operator or failed.
  - id: app-icon
    file: site/public/apple-touch-icon.png
    use: The mark as the home screen icon for the site and paired phones.
clearSpaceRatio: 0.25
minSizePx: 12
colorways:
  - foreground: text-head
    background: bg
  - foreground: accent
    background: bg
misuse:
  - Never set the wordmark in mixed case or a typeface other than CommitMono.
  - Never style VOID apart from GLIMMER (outline, second color, weight); the wordmark is one ink.
  - Never fill the brackets or round their joins; they are mitered strokes.
  - Never recolor the brackets with a state color; only the light carries state.
  - Never add a gradient, glow or drop shadow to the mark at rest.
  - Never color the stacked wordmark's diamond with a state color; it is the accent, like the mark's light.
  - Never set a product name such as CLOUD as a tag, badge or pill beside the wordmark.
