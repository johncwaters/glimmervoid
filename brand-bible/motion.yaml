durationsMs:
  fast: 150
  med: 250
  leave: 200
  arrive: 480
  status-spin: 2600
  status-ping: 1600
  status-look: 5600
  waiting-breathe: 2000
  failure-glow: 1400
  flash: 900
  shimmer: 1200
  fade-out: 2000
easings:
  ease-out-quart: cubic-bezier(0.22, 1, 0.36, 1)
  ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1)
  ease-in-expo: cubic-bezier(0.7, 0, 0.84, 0)
reducedMotion: required
logoAnimation: While connecting the brackets scan; when the dashboard is ready the mark spins once like a vault dial, the brackets clamp, the light comes on and the mark bursts away.
rules:
  - rule: Motion only answers a real state change (running, waiting, failed, connecting) or direct input.
    why: Motion that means nothing teaches the operator to ignore the motion that does.
  - rule: Signature animations (the brand mark, the status icons, the waiting card breathe and the failed card glow) keep their pinned durations; never retune one for consistency with the rest.
    why: Each was tuned on its own to read at a glance, and flattening them to a shared value loses that read.
  - rule: Generic chrome motion (row cues, loading, rows leaving) uses the flash, shimmer or fade-out duration, or a transition token; never a new one-off value.
    why: One-off timings drift until no two parts of the dashboard move alike.
  - rule: A state loop stops after 3 cycles, except a status icon, which runs while its state holds.
    why: A card pulsing for minutes reads as noise, while a small icon carries the state continuously.
  - rule: Animate transform and opacity only; never shift layout.
    why: The terminal must never jump under the operator's eyes.
  - rule: Under prefers-reduced-motion, animation and transitions stop.
    why: Reduced motion is honored strictly, not softened.
