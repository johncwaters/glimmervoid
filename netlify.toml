[build]
  base = "site"
  command = "npm ci --prefix .. --ignore-scripts && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml && ! git diff $CACHED_COMMIT_REF $COMMIT_REF -- ../package.json | grep -qE '^[+] +\"version\":'"

[build.environment]
  NODE_VERSION = "24"
