[build]
  base = "site"
  command = "npm ci --prefix .. --ignore-scripts && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../public ../shared ../session ../server ../package.json ../package-lock.json ../netlify.toml"

[build.environment]
  NODE_VERSION = "24"
