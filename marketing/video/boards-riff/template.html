<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimmervoid: boards, riff</title>
<style>
@font-face { font-family: CommitMono; font-weight: 400; src: url(data:font/woff2;base64,__FONT400__) format("woff2"); }
@font-face { font-family: CommitMono; font-weight: 700; src: url(data:font/woff2;base64,__FONT700__) format("woff2"); }
:root { color-scheme: dark; --bg: #0f0d15; --card: #1b1721; --border: #3b3448; --text: #cfcbd9; --muted: #9e97af; --accent: #b688fe; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: CommitMono, monospace; }
body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
#stage { width: 1056px; max-width: 100%; height: auto; aspect-ratio: 16 / 9; display: block; font-family: CommitMono, monospace; }
.chrome { display: flex; gap: 14px; align-items: center; font-size: 14px; }
.chrome button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 8px 14px; cursor: pointer; }
.chrome button:focus-visible, .chrome input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chrome label { display: flex; gap: 8px; align-items: center; color: var(--muted); }
#sound-hint { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .chrome .motion-note { display: inline; } }
.motion-note { display: none; color: var(--muted); }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1056" height="594" role="img" aria-label="Glimmervoid boards: inside the real dashboard, an agent's wall of text in the terminal breaks apart into a prototype on the board beside it, the operator marks it up in red, and the plan rises as a skyline."></svg>
<div class="chrome">
  <button id="pause" type="button">Play/pause</button>
  <button id="restart" type="button">Restart</button>
  <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8"></label>
  <span id="sound-hint" hidden>Click anywhere for sound</span>
  <span class="motion-note">Reduced motion: showing a still.</span>
</div>
<audio id="narration" preload="auto" src="data:audio/mp4;base64,__AUDIO__"><track kind="captions" src="data:text/vtt,WEBVTT"></audio>
<script>
const COLOR = {
  bg: "#0f0d15", card: "#1b1721", header: "#15121b", surface: "#211d29",
  border: "#3b3448", borderDim: "#2b2636", borderHover: "#4b435a",
  text: "#cfcbd9", textDim: "#b0aabf", textHead: "#efedf6", textMuted: "#9e97af",
  accent: "#b688fe", accentDim: "#7a4aba",
  boxStroke: "#b3a7d4",
  stickyFill: "#594e2f", stickyStroke: "#e2c45a", stickyText: "#f3e8c0",
  selectedRow: "#2e2639", tabActive: "#2e253d",
  page: "#1a1621", chrome: "#131119", paneHeader: "#201c27", tabGroup: "#1c1825", rule: "#373541", divider: "#292434",
  promptBlock: "#38393c", doneRow: "#17282a", doneBadge: "#1f5c45", doneGlyph: "#4ac19c", attention: "#f59e0b", attentionFill: "#2a1a0c",
  agentGlyph: "#d97757", mascot: "#d58585", bypass: "#ef6b8a", watching: "#60a5fa",
  running: "#22c55e", waiting: "#f59e0b", failed: "#f84d4c", idle: "#eab308", complete: "#34d399",
};

const TIMELINE = {
  promptStart: 0.2, promptEnd: 0.9,
  streamStart: 1.0, streamEnd: 3.0,
  highlight: 3.1,
  boardOpen: 3.3,
  fallStart: 4.0,
  flyStart: 4.3,
  phoneDraw: 4.6,
  drop: 5.6,
  drewLine: 6.0,
  settingsToolCall: 4.9,
  cursorIn: 6.45, cursorClick: 7.55,
  operatorCursorIn: 12.0,
  paneZoomIn: 8.0, paneZoomInEnd: 8.9,
  tiltStart: 9.0, tiltEnd: 9.8,
  agentLiftStart: 9.7, operatorLiftStart: 10.3, liftSeconds: 0.6,
  dragStart: 12.75, dragEnd: 13.6,
  penStart: 13.95, penEnd: 14.6,
  noteDrop: 15.1,
  collapseStart: 11.3, collapseEnd: 12.1,
  paneZoomOut: 16.2, paneZoomOutEnd: 17.2,
  fixPromptStart: 17.5, fixPromptEnd: 18.1,
  agentFix: 18.2,
  rowSnap: 18.4,
  saveMove: 18.7,
  replyLine: 19.95,
  inkClear: 19.7,
  planPromptStart: 20.2, planPromptEnd: 20.8,
  paneZoomIn2: 21.1, paneZoomIn2End: 24.1,
  diveStart: 21.1, diveEnd: 24.1,
  archBoxes: Array.from({ length: 10 }, (_, boxIndex) => 22.65 + boxIndex * 0.09),
  archWires: Array.from({ length: 12 }, (_, wireIndex) => 24.2 + wireIndex * 0.07),
  planIn: 25.4,
  splitStart: 26, splitEnd: 27,
  building: [27.2, 27.9, 28.05, 28.95],
  landed: [27.9, 28.75, 28.95, 29.7],
  fillPromptStart: 36.75, fillPromptEnd: 37.4,
  boardOutStart: 37.7, boardOutEnd: 39, linkDraw: 38.8,
  fillPut: 38.9, widgetsStart: 39, widgetsEnd: 40.6, fillReply: 39.6,
  pullStart: 39, pullEnd: 40.9,
  planLandedLine: 30.1,
  liveTypeShot: 30.4, liveTypeShotEnd: 31.1,
  livePromptStart: 31.4, livePromptEnd: 32.1,
  liveAttach: 32.35, livePut: 32.65, liveReply: 33.2,
  liveZoomIn: 33.4, liveZoomInEnd: 34.4, liveZoomOut: 35.5, liveZoomOutEnd: 36.2,
  dashboardLeave: 40.7,
  markIn: 40.8,
  markClamp: 41.7,
  total: 45,
};
const TITLE_CARDS = {
  draws: { lines: ["Your agent", "draws it on a board."], accentLine: 1 },
  layers: { lines: ["Collaborate", "locally."], accentLine: 1 },
  plans: { lines: ["Architecture and plans,", "on the same board."], accentLine: 1 },
  side: { lines: ["Board and terminal,", "side by side."], accentLine: 1 },
};
const PLAYBACK = [
  { play: [0, 25.95] },
  { play: [26.45, TIMELINE.total] },
];
const CARD_TITLE_SIZE = 96;
const CARD_TRACKING_EM = -0.02;
const CARD_LINE_HEIGHT = 1.08;
const CARD_WORD_STAGGER_SECONDS = 0.05;
const SCENE_DIM_SECONDS = 0.25;
const SCENE_DIM_OPACITY = 0.1;
const titleCardSecondsFor = (card) => 1.0 + 0.2 * card.lines.join(" ").split(" ").length;
const PLAYBACK_SEGMENTS = (() => {
  const segments = [];
  let realStart = 0;
  for (const entry of PLAYBACK) {
    if (entry.play) {
      const [storyStart, storyEnd] = entry.play;
      segments.push({ kind: "play", realStart, storyStart, storyEnd, seconds: storyEnd - storyStart });
      realStart += storyEnd - storyStart;
      continue;
    }
    const card = TITLE_CARDS[entry.hold];
    const seconds = titleCardSecondsFor(card);
    const storyAt = segments[segments.length - 1].storyEnd;
    segments.push({ kind: "hold", realStart, storyStart: storyAt, storyEnd: storyAt, seconds, card });
    realStart += seconds;
  }
  return segments;
})();
window.totalSeconds = PLAYBACK_SEGMENTS.reduce((sum, segment) => sum + segment.seconds, 0);
function realTimeAt(storySeconds) {
  const playing = PLAYBACK_SEGMENTS.find((segment) => segment.kind === "play" && storySeconds >= segment.storyStart && storySeconds < segment.storyEnd);
  if (playing) return playing.realStart + storySeconds - playing.storyStart;
  const nextPlay = PLAYBACK_SEGMENTS.find((segment) => segment.kind === "play" && segment.storyStart >= storySeconds);
  return nextPlay ? nextPlay.realStart : window.totalSeconds;
}
function segmentAtRealTime(realSeconds) {
  return PLAYBACK_SEGMENTS.find((segment) => realSeconds < segment.realStart + segment.seconds) ?? PLAYBACK_SEGMENTS[PLAYBACK_SEGMENTS.length - 1];
}
function storyTimeAt(realSeconds) {
  const segment = segmentAtRealTime(realSeconds);
  if (segment.kind === "hold") return segment.storyStart;
  return Math.min(segment.storyEnd, segment.storyStart + realSeconds - segment.realStart);
}

const ARRIVE_SECONDS = 0.48;
const LEAVE_SECONDS = 0.2;
const MONO_ADVANCE_EM = 0.6;
const ISO_COS = Math.cos(Math.PI / 6);
const ISO_SIN = 0.5;

const clamp01 = (value) => Math.min(1, Math.max(0, value));
const progressBetween = (time, start, durationSeconds) => clamp01((time - start) / durationSeconds);
const lerp = (from, to, amount) => from + (to - from) * amount;
const easeOutQuart = (p) => 1 - (1 - p) ** 4;
const easeInOutSine = (p) => -(Math.cos(Math.PI * p) - 1) / 2;
const easeOutExpo = (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p));
const easeInExpo = (p) => (p <= 0 ? 0 : 2 ** (10 * p - 10));
const easeInOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2);
const hashOf = (seed) => { const value = Math.sin(seed * 12.9898 + 78.233) * 43758.5453; return value - Math.floor(value); };

const GLYPHS = {};
const GLYPH_DEFS = Object.entries(GLYPHS).map(([weight, face]) => Object.entries(face.glyphs).filter(([, pathData]) => pathData).map(([character, pathData]) => `<path id="g${weight}-${character.charCodeAt(0)}" d="${pathData}"/>`).join("")).join("");
function textElement(x, y, text, { size = 24, weight = 400, fill = COLOR.text, anchor = "start", opacity = 1, spacing = 0 } = {}) {
  const face = GLYPHS[String(weight)];
  const unitsPerPixel = face.unitsPerEm / size;
  const step = face.advance + spacing * unitsPerPixel;
  const characters = [...text];
  const width = characters.length * step - spacing * unitsPerPixel;
  const anchorShift = { start: 0, middle: width / 2, end: width }[anchor];
  const uses = characters.map((character, index) => {
    const glyphLeft = index * step - anchorShift;
    if (character === "\u00b7") return `<circle cx="${(glyphLeft + face.advance / 2).toFixed(1)}" cy="${(face.unitsPerEm * 0.3).toFixed(1)}" r="${(face.unitsPerEm * 0.06).toFixed(1)}"/>`;
    if (character === "\u23bf") return `<path d="M${(glyphLeft + face.advance * 0.35).toFixed(1)} ${face.unitsPerEm * 0.8}V${face.unitsPerEm * 0.3}H${(glyphLeft + face.advance).toFixed(1)}" fill="none" stroke="currentColor" stroke-width="${face.unitsPerEm * 0.07}"/>`;
    if (!face.glyphs[character]) return "";
    return `<use href="#g${weight}-${character.charCodeAt(0)}" x="${(index * step - anchorShift).toFixed(1)}"/>`;
  }).join("");
  return `<g transform="translate(${x} ${y}) scale(${size / face.unitsPerEm} ${-size / face.unitsPerEm})" fill="${fill}" color="${fill}" opacity="${opacity}">${uses}</g>`;
}

function drawTitleCard(card, localSeconds) {
  const characterWidth = CARD_TITLE_SIZE * (MONO_ADVANCE_EM + CARD_TRACKING_EM);
  const lineHeight = CARD_TITLE_SIZE * CARD_LINE_HEIGHT;
  const firstBaseline = 540 - ((card.lines.length - 1) * lineHeight) / 2 + CARD_TITLE_SIZE * 0.35;
  const leave = easeInExpo(progressBetween(localSeconds, titleCardSecondsFor(card) - LEAVE_SECONDS - SCENE_DIM_SECONDS, LEAVE_SECONDS));
  const parts = [`<g opacity="${1 - leave}" transform="translate(0 ${-leave * 18})">`];
  let wordIndex = 0;
  card.lines.forEach((line, lineIndex) => {
    const baseline = firstBaseline + lineIndex * lineHeight;
    const lineWidth = line.length * characterWidth - CARD_TITLE_SIZE * CARD_TRACKING_EM;
    const lineLeft = 960 - lineWidth / 2;
    const fill = lineIndex === card.accentLine ? COLOR.accent : COLOR.textHead;
    let column = 0;
    for (const word of line.split(" ")) {
      const arrive = easeOutExpo(progressBetween(localSeconds, wordIndex * CARD_WORD_STAGGER_SECONDS, ARRIVE_SECONDS));
      wordIndex += 1;
      const wordLeft = lineLeft + column * characterWidth;
      column += word.length + 1;
      parts.push(`<g opacity="${arrive}" transform="translate(0 ${(1 - arrive) * 28})">` +
        textElement(wordLeft, baseline, word, { size: CARD_TITLE_SIZE, weight: 700, fill, spacing: CARD_TITLE_SIZE * CARD_TRACKING_EM }) + "</g>");
    }
  });
  parts.push("</g>");
  return parts.join("");
}
function drawTitleCards(realSeconds) {
  const segment = segmentAtRealTime(realSeconds);
  if (segment.kind !== "hold") return "";
  return drawTitleCard(segment.card, realSeconds - segment.realStart);
}
function sceneDimAt(realSeconds) {
  const segment = segmentAtRealTime(realSeconds);
  if (segment.kind !== "hold") return 0;
  const intoHold = realSeconds - segment.realStart;
  const untilEnd = segment.realStart + segment.seconds - realSeconds;
  return easeInOutCubic(clamp01(Math.min(intoHold, untilEnd) / SCENE_DIM_SECONDS));
}

const OPERATOR_PROMPT = "redo the settings screen";
const AGENT_PARAGRAPH = "Settings becomes four rows. Profile holds name, avatar and email. Billing holds plan and invoices. Alerts covers email and push. Danger zone goes last, with a red label. Save stays pinned to the bottom, full width, in the accent color. Each row gets a 2px left border and 10px padding, the detail line sits under the name in a dimmer tone, and on narrow screens the rows stack so the detail wraps under the name, unless the name is longer than 18 characters, in which case it truncates with a fade, not dots, and the fade uses the card color at 0% to 100% over the last 24px. The header is 56px tall with the title left aligned at 20px, semibold, and a back chevron at 44px tap size. Between Billing and Alerts there is a 12px gap, but between Alerts and Danger zone the gap is 24px with a 1px divider in the border color at 40% opacity, inset 16px on both sides. Profile shows the avatar at 40px, circular, 2px ring in the accent, to the left of the name, with the email below in 13px. Billing shows the plan as a pill, violet for Pro, gray for Free, and the next invoice date right aligned. Alerts has two toggles, email and push, each 44px tall, the push toggle disabled until the browser grants permission, with a helper line under it. Danger zone is red text on the card color, not a red card, and opens a confirm sheet from the bottom with the account name typed to confirm. Save stays disabled until something changes, then animates in over 200ms, and on success shows a check for 1.2s before returning to Save.";
const DASHBOARD = { width: 1440, height: 810 };
const TOPBAR_HEIGHT = 54;
const STATUS_BAR = { y: 810, height: 0 };
const SIDEBAR_WIDTH = 320;
const HEADER_HEIGHT = 41;
const UI_TEXT = 13;
const UI_ADVANCE = UI_TEXT * MONO_ADVANCE_EM;
const TERMINAL = { x: SIDEBAR_WIDTH, y: TOPBAR_HEIGHT, openWidth: 540, fullWidth: DASHBOARD.width - SIDEBAR_WIDTH, height: STATUS_BAR.y - TOPBAR_HEIGHT };
const PANE = { x: TERMINAL.x + TERMINAL.openWidth + 2, y: TOPBAR_HEIGHT, width: DASHBOARD.width - TERMINAL.x - TERMINAL.openWidth - 2, bodyY: TOPBAR_HEIGHT + HEADER_HEIGHT, bodyHeight: STATUS_BAR.y - TOPBAR_HEIGHT - HEADER_HEIGHT };
const PANE_FIT_SCALE = PANE.width / 1920;
const BOARD_SCALE = 0.62;
const paneSceneOriginAt = (scale) => ({ x: PANE.x + PANE.width / 2 - 960 * scale, y: PANE.bodyY + PANE.bodyHeight / 2 - 540 * scale });
const sceneToDashboard = (sceneX, sceneY) => {
  const origin = paneSceneOriginAt(BOARD_SCALE);
  return { x: origin.x + sceneX * BOARD_SCALE, y: origin.y + sceneY * BOARD_SCALE };
};
const TERMINAL_TEXT = { left: TERMINAL.x + 23, lineHeight: 16, firstBlockY: TOPBAR_HEIGHT + HEADER_HEIGHT + 104, inputY: DASHBOARD.height - 51 };
const WALL = { x: TERMINAL_TEXT.left, y: TERMINAL_TEXT.firstBlockY + 34, size: UI_TEXT, lineHeight: TERMINAL_TEXT.lineHeight };
const WALL_ADVANCE = WALL.size * MONO_ADVANCE_EM;
const WALL_MAX_CHARS = Math.floor((TERMINAL.openWidth - 50) / WALL_ADVANCE);

const SETTINGS_ROWS = [
  { title: "Profile", detail: "ada@park.dev", lead: "avatar", trail: "chevron", titleColor: COLOR.textHead },
  { title: "Billing", detail: "Pro plan, $12/mo", lead: "payment", tile: COLOR.watching, trail: "chevron", titleColor: COLOR.textHead },
  { title: "Alerts", detail: "Email and push", lead: "bell", tile: COLOR.waiting, trail: "toggle", titleColor: COLOR.textHead },
  { title: "Danger zone", detail: "Delete account", lead: "alert", tile: COLOR.failed, trail: "chevron", titleColor: COLOR.failed },
];
const PHONE = { left: -180, top: -390, right: 180, bottom: 390 };
const ROW = { left: -160, right: 160, textLeft: -88, firstTop: -280, pitch: 108, height: 96 };
const SAVE = { left: -160, right: 160, height: 72, pinnedTop: 290, movedTop: ROW.firstTop + 4 * ROW.pitch + 14 };
const rowTop = (rowIndex) => ROW.firstTop + rowIndex * ROW.pitch;
const TITLE_SIZE = 30;
const TITLE_ADVANCE = TITLE_SIZE * MONO_ADVANCE_EM;

const HERO_TARGETS = [
  { word: "Profile", rowIndex: 0, offsetChars: 0 },
  { word: "Billing", rowIndex: 1, offsetChars: 0 },
  { word: "Alerts", rowIndex: 2, offsetChars: 0 },
  { word: "Danger", rowIndex: 3, offsetChars: 0 },
  { word: "zone", rowIndex: 3, offsetChars: 7 },
  { word: "Save", rowIndex: -1, offsetChars: 0 },
];
const FLY_STAGGER_SECONDS = 0.1;
const FLY_SECONDS = 1.1;

const WALL_WORDS = (() => {
  const words = [];
  let lineIndex = 0;
  let column = 0;
  for (const token of AGENT_PARAGRAPH.split(" ")) {
    if (column > 0 && column + token.length > WALL_MAX_CHARS) {
      lineIndex += 1;
      column = 0;
    }
    words.push({ text: token, lineIndex, column, heroIndex: -1 });
    column += token.length + 1;
  }
  HERO_TARGETS.forEach((target, heroIndex) => {
    const match = words.find((word, index) => word.heroIndex === -1 && word.text.replace(/[^A-Za-z]/g, "") === target.word && (target.word !== "zone" || words[index - 1].text === "Danger"));
    match.heroIndex = heroIndex;
  });
  return words;
})();
const WALL_LINES = WALL_WORDS.reduce((lines, word) => {
  lines[word.lineIndex] = lines[word.lineIndex] === undefined ? word.text : `${lines[word.lineIndex]} ${word.text}`;
  return lines;
}, []);
const WALL_CHAR_COUNT = WALL_LINES.reduce((sum, line) => sum + line.length, 0);

function heroLandsAt(heroIndex) {
  return TIMELINE.flyStart + heroIndex * FLY_STAGGER_SECONDS + FLY_SECONDS;
}
function heroTargetScreen(heroIndex) {
  const target = HERO_TARGETS[heroIndex];
  if (target.rowIndex < 0) return sceneToDashboard(960 - (target.word.length * TITLE_ADVANCE) / 2, 540 + SAVE.pinnedTop + 46);
  return sceneToDashboard(960 + ROW.textLeft + target.offsetChars * TITLE_ADVANCE, 540 + rowTop(target.rowIndex) + 42);
}

function drawWall(time) {
  if (time > TIMELINE.flyStart + 6 * FLY_STAGGER_SECONDS + FLY_SECONDS) return "";
  const bullet = time >= TIMELINE.streamStart && time < TIMELINE.fallStart + 0.3 ? `<circle cx="${TERMINAL.x + 12}" cy="${WALL.y - 4}" r="3.5" fill="${COLOR.textHead}"/>` : "";
  if (time < TIMELINE.streamEnd) return `<g clip-path="url(#terminal-clip)">${bullet}${drawStreamingWall(time)}</g>`;
  const words = WALL_WORDS.map((word, index) => ({ word, index }));
  const falling = words.filter(({ word }) => word.heroIndex < 0).map(({ word, index }) => drawWallWord(word, index, time)).join("");
  const heroes = words.filter(({ word }) => word.heroIndex >= 0).map(({ word, index }) => drawWallWord(word, index, time)).join("");
  return `<g clip-path="url(#terminal-clip)">${bullet}${falling}</g>${heroes}`;
}

function drawStreamingWall(time) {
  const revealedChars = Math.floor(WALL_CHAR_COUNT * progressBetween(time, TIMELINE.streamStart, TIMELINE.streamEnd - TIMELINE.streamStart));
  let remaining = revealedChars;
  return WALL_LINES.map((line, lineIndex) => {
    if (remaining <= 0) return "";
    const shown = line.slice(0, remaining);
    remaining -= line.length;
    return textElement(WALL.x, WALL.y + lineIndex * WALL.lineHeight, shown, { size: WALL.size, fill: COLOR.textDim });
  }).join("");
}

function drawWallWord(word, index, time) {
  const x = WALL.x + word.column * WALL_ADVANCE;
  const y = WALL.y + word.lineIndex * WALL.lineHeight;
  const dim = easeOutQuart(progressBetween(time, TIMELINE.highlight, 0.6));
  if (word.heroIndex >= 0) return drawFlyingHero(word, x, y, time);
  const fallDelay = TIMELINE.fallStart + hashOf(index) * 0.45 + (word.lineIndex / WALL_LINES.length) * 0.35;
  const fall = progressBetween(time, fallDelay, 0.9);
  if (fall >= 1) return "";
  const drop = easeInExpo(fall) * 1300;
  const drift = (hashOf(index + 500) - 0.5) * 160 * fall;
  const spin = (hashOf(index + 900) - 0.5) * 90 * easeInExpo(fall);
  const opacity = lerp(1, 0.22, dim) * (1 - easeInExpo(fall));
  return `<g transform="translate(${x + drift} ${y + drop}) rotate(${spin})">${textElement(0, 0, word.text, { size: WALL.size, fill: COLOR.textDim, opacity })}</g>`;
}

function drawFlyingHero(word, x, y, time) {
  const flyBegin = TIMELINE.flyStart + word.heroIndex * FLY_STAGGER_SECONDS;
  if (time >= flyBegin + FLY_SECONDS) return "";
  const fly = easeOutQuart(progressBetween(time, flyBegin, FLY_SECONDS));
  const target = heroTargetScreen(word.heroIndex);
  const arc = -90 * 4 * fly * (1 - fly);
  const letters = word.text.replace(/[^A-Za-z]/g, "");
  const highlighted = time >= TIMELINE.highlight;
  const fill = highlighted ? COLOR.accent : COLOR.textDim;
  return textElement(lerp(x, target.x, fly), lerp(y, target.y, fly) + arc, highlighted ? letters : word.text, { size: lerp(WALL.size, TITLE_SIZE * BOARD_SCALE, fly), weight: highlighted ? 700 : 400, fill });
}

function planeMatrix(tilt, lift, scale, yShift) {
  return {
    a: lerp(1, ISO_COS * scale, tilt), b: lerp(0, ISO_SIN * scale, tilt),
    c: lerp(0, -ISO_COS * scale, tilt), d: lerp(1, ISO_SIN * scale, tilt),
    e: 960, f: 540 + yShift * tilt - lift,
  };
}
const matrixAttribute = (matrix) => `matrix(${matrix.a} ${matrix.b} ${matrix.c} ${matrix.d} ${matrix.e} ${matrix.f})`;
const project = (matrix, u, v) => [matrix.a * u + matrix.c * v + matrix.e, matrix.b * u + matrix.d * v + matrix.f];

const BOARD_PLANE = { halfWidth: 650, halfHeight: 430 };
const BOARD_ISO_SCALE = 0.7;
const BOARD_ISO_SHIFT = 130;
const AGENT_LIFT = 110;
const OPERATOR_LIFT = 220;

function boardTiltAt(time) {
  const into = easeInOutCubic(progressBetween(time, TIMELINE.tiltStart, TIMELINE.tiltEnd - TIMELINE.tiltStart));
  const out = easeInOutCubic(progressBetween(time, TIMELINE.collapseStart, TIMELINE.collapseEnd - TIMELINE.collapseStart));
  return into * (1 - out);
}
function layerLiftAt(time, liftStart) {
  const up = easeOutQuart(progressBetween(time, liftStart, TIMELINE.liftSeconds));
  const down = easeInOutCubic(progressBetween(time, TIMELINE.collapseStart, (TIMELINE.collapseEnd - TIMELINE.collapseStart) * 0.8));
  return up * (1 - down);
}
function layerLabelOpacityAt(time, appearAt) {
  return easeOutQuart(progressBetween(time, appearAt, ARRIVE_SECONDS)) * (1 - progressBetween(time, TIMELINE.collapseStart, 0.3));
}

function drawPlaneRect(matrix, { fill, stroke, dashed = false, opacity = 1 }) {
  const { halfWidth, halfHeight } = BOARD_PLANE;

const DIVE_MAX_ZOOM = 1080 / SAVE.height;
const DIVE_DASHBOARD_SHARE = 0.6;
function diveProgressAt(time) {
  return easeInOutCubic(progressBetween(time, TIMELINE.diveStart, TIMELINE.diveEnd - TIMELINE.diveStart));
}
function diveDashboardZoomAt(time) {
  const settle = easeInOutCubic(clamp01(diveProgressAt(time) / DIVE_DASHBOARD_SHARE));
  return Math.exp(lerp(Math.log(CAMERA_SHOTS.overview.zoom), Math.log(CAMERA_SHOTS.pane.zoom), settle));
}
const hexChannels = (hex) => [1, 3, 5].map((offset) => parseInt(hex.slice(offset, offset + 2), 16));
function mixColor(fromHex, toHex, amount) {
  const from = hexChannels(fromHex);
  const to = hexChannels(toHex);
  return `rgb(${from.map((channel, index) => Math.round(lerp(channel, to[index], amount))).join(" ")})`;
}
function diveZoomAt(time) {
  const boardOnScreen = Math.exp(lerp(Math.log(CAMERA_SHOTS.overview.zoom * BOARD_SCALE), Math.log(DIVE_MAX_ZOOM), diveProgressAt(time)));
  return Math.max(1, boardOnScreen / (diveDashboardZoomAt(time) * BOARD_SCALE));
}
function diveCameraAt(time) {
  const zoom = diveZoomAt(time);
  const targetX = 960;
  const targetY = 540 + SAVE.movedTop + SAVE.height / 2;
  const anchor = diveAnchorAt(time);
  const screenY = lerp(targetY, 540, anchor);
  return { zoom, centerX: targetX, centerY: targetY - (screenY - 540) / zoom, targetX, targetY };
}

const POINTER_PATH = "M0 0L0 26L7 20L12 31L17 29L12 18L21 18Z";
function drawPointer(x, y, size, opacity) {
  if (opacity <= 0) return "";
  const scale = size / 31;
  return `<g opacity="${opacity}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})"><path d="${POINTER_PATH}" fill="${COLOR.textHead}" stroke="${COLOR.bg}" stroke-width="2.5" stroke-linejoin="round"/></g>`;
}
function curvePoint(from, control, to, amount) {
  const inverse = 1 - amount;
  return [inverse * inverse * from[0] + 2 * inverse * amount * control[0] + amount * amount * to[0], inverse * inverse * from[1] + 2 * inverse * amount * control[1] + amount * amount * to[1]];
}
function drawClickRing(x, y, time, clickAt, radius) {
  const ring = progressBetween(time, clickAt, 0.45);
  if (ring <= 0 || ring >= 1) return "";
  return `<circle cx="${x}" cy="${y}" r="${(radius * easeOutExpo(ring)).toFixed(1)}" fill="none" stroke="${COLOR.accent}" stroke-width="${radius / 9}" opacity="${1 - ring}"/>`;
}
const CURSOR_HOVER_SECONDS = 0.25;
const CURSOR_PRESS_SECONDS = 0.12;
function cursorPressScale(time, clickAt) {
  return time >= clickAt && time < clickAt + CURSOR_PRESS_SECONDS ? 0.85 : 1;
}
function drawOverviewCursor(time) {

  const from = [TERMINAL.x + 380, DASHBOARD.height + 30];

  const [x, y] = leave > 0 ? curvePoint([target.x, target.y], [target.x + 80, target.y + 40], exit, leave) : curvePoint(from, [from[0] + 20, target.y + 120], [target.x, target.y], arrive);
  return drawClickRing(target.x, target.y, time, TIMELINE.cursorClick, 26) + drawPointer(x, y, 22 * cursorPressScale(time, TIMELINE.cursorClick), 1);
}
function drawPhoneSelection(time) {

  if (shown <= 0) return "";

const NOTE_GRAB = [330, 196];
const OPERATOR_CURSOR_ENTRY = [2000, 1160];
const OPERATOR_CURSOR_EXIT = [2000, 760];
function operatorCursorScreenPoint(time, operatorMatrix) {
  const onPlane = (point) => project(operatorMatrix, point[0], point[1]);
  const circleStart = onPlane(penTipAt(TIMELINE.penStart));
  const grabPoint = onPlane(DRAG_GRAB);
  if (time < TIMELINE.dragStart) {
    const arrive = easeOutQuart(progressBetween(time, TIMELINE.operatorCursorIn, TIMELINE.dragStart - CURSOR_HOVER_SECONDS - TIMELINE.operatorCursorIn));
    return curvePoint(OPERATOR_CURSOR_ENTRY, [grabPoint[0] + 260, OPERATOR_CURSOR_ENTRY[1] - 60], grabPoint, arrive);
  }
  const dropOffset = draggedRowOffsetAt(Math.min(time, TIMELINE.dragEnd));
  const carried = onPlane([DRAG_GRAB[0] + dropOffset.dx, DRAG_GRAB[1] + dropOffset.dy]);
  if (time < TIMELINE.dragEnd) return carried;
  if (time < TIMELINE.penStart) {
    const move = easeOutQuart(progressBetween(time, TIMELINE.dragEnd + 0.08, TIMELINE.penStart - CURSOR_HOVER_SECONDS - TIMELINE.dragEnd));
    return curvePoint(carried, [carried[0] + 180, (carried[1] + circleStart[1]) / 2], circleStart, move);
  }
  if (time < TIMELINE.penEnd) return onPlane(penTipAt(time));
  const notePoint = onPlane(NOTE_GRAB);
  if (time < TIMELINE.noteDrop) {
    const circleEnd = onPlane(penTipAt(TIMELINE.penEnd));
    const move = easeOutQuart(progressBetween(time, TIMELINE.penEnd + 0.08, TIMELINE.noteDrop - CURSOR_HOVER_SECONDS - TIMELINE.penEnd));
    return curvePoint(circleEnd, [(circleEnd[0] + notePoint[0]) / 2, Math.max(circleEnd[1], notePoint[1]) + 50], notePoint, move);
  }
  const leave = easeInExpo(progressBetween(time, TIMELINE.noteDrop + 0.3, 0.3));
  return curvePoint(notePoint, [notePoint[0] + 120, notePoint[1] + 30], OPERATOR_CURSOR_EXIT, leave);
}

function drawBoardStage(time) {
  const tilt = boardTiltAt(time);
  const agentLift = layerLiftAt(time, TIMELINE.agentLiftStart);
  const operatorLift = layerLiftAt(time, TIMELINE.operatorLiftStart);
  const camera = diveCameraAt(time);
  const zoomFade = clamp01((camera.zoom - 2) / 2);
  const planeShown = clamp01(tilt * 1.5);
  const baseMatrix = planeMatrix(tilt, 0, BOARD_ISO_SCALE, BOARD_ISO_SHIFT);
  const agentMatrix = planeMatrix(tilt, AGENT_LIFT * agentLift, BOARD_ISO_SCALE, BOARD_ISO_SHIFT);
  const operatorMatrix = planeMatrix(tilt, OPERATOR_LIFT * operatorLift, BOARD_ISO_SCALE, BOARD_ISO_SHIFT);
  const operatorPlane = operatorLift > 0.01 ? drawPlaneRect(operatorMatrix, { fill: "none", stroke: COLOR.failed, dashed: true, opacity: operatorLift * 0.8 }) : "";
  const archInside = drawArchitectureInsideSave(time, camera);
  const canvasDots = `<rect x="-3000" y="-2000" width="7920" height="5080" fill="url(#dots)" opacity="${(1 - planeShown) * (1 - zoomFade)}"/>`;
  const base = canvasDots + drawPlaneRect(baseMatrix, { fill: "url(#dots)", stroke: COLOR.border, opacity: planeShown * (1 - zoomFade) }) +
    (agentLift > 0.01 ? drawPlaneRect(agentMatrix, { fill: COLOR.bg, stroke: COLOR.accentDim, opacity: agentLift * 0.85 }) : "");
  const agentLayer = `<g transform="${matrixAttribute(agentMatrix)}" opacity="${1 - easeInOutCubic(progressBetween(diveProgressAt(time), 0.62, 0.25))}">${drawPhone(time)}${drawPhoneSelection(time)}</g>`;
  const operatorLayer = `<g transform="${matrixAttribute(operatorMatrix)}">${drawPen(time)}${drawNote(time)}</g>`;
  const labels = drawLayerLabel(baseMatrix, "board", COLOR.textMuted, layerLabelOpacityAt(time, TIMELINE.tiltEnd)) +
    drawLayerLabel(agentMatrix, "agent draws", COLOR.accent, layerLabelOpacityAt(time, TIMELINE.agentLiftStart + TIMELINE.liftSeconds - 0.2)) +
    drawLayerLabel(operatorMatrix, "you draw", COLOR.failed, layerLabelOpacityAt(time, TIMELINE.operatorLiftStart + TIMELINE.liftSeconds - 0.2));
  const scene = base + agentLayer + archInside + operatorPlane + operatorLayer + labels + drawOperatorCursor(time, operatorMatrix);
  return `<g transform="translate(960 540) scale(${camera.zoom}) translate(${-camera.centerX} ${-camera.centerY})">${scene}</g>`;
}

function pointAlongWire(points, share) {

  for (const [pointIndex, length] of segmentLengths.entries()) {
    if (remaining <= length) {
      const [fromX, fromY] = points[pointIndex];
      const [toX, toY] = points[pointIndex + 1];
      return [lerp(fromX, toX, remaining / length), lerp(fromY, toY, remaining / length)];
    }
    remaining -= length;
  }
  return points[points.length - 1];
}

  const lightOn = progressBetween(time, TIMELINE.markClamp, 0.25);
  const brackets = BRAND_BRACKETS.map(({ d, dx, dy }) => `<path d="${d}" transform="translate(${dx * (1 - clamp) * 60} ${dy * (1 - clamp) * 60})" fill="none" stroke="${COLOR.textHead}" stroke-width="11" stroke-linejoin="miter" stroke-linecap="butt" opacity="${clamp01(markIn * 3)}"/>`).join("");
  const light = `<g transform="translate(50 50) scale(${lerp(0.2, 1, easeOutExpo(lightOn))}) translate(-50 -50)" opacity="${lightOn}"><path d="${BRAND_LIGHT}" fill="${COLOR.accent}"/></g>`;
  const wordmark = easeOutExpo(progressBetween(time, TIMELINE.markClamp + 0.3, ARRIVE_SECONDS));
  const tagline = easeOutExpo(progressBetween(time, TIMELINE.markClamp + 0.7, ARRIVE_SECONDS));
  const link = easeOutExpo(progressBetween(time, TIMELINE.markClamp + 1.1, ARRIVE_SECONDS));
  return `<g transform="translate(${MARK.x} ${MARK.y}) rotate(${spin}) scale(${MARK.size / 108}) translate(-50 -50)">${brackets}${light}</g>` +
    `<g opacity="${wordmark}" transform="translate(0 ${(1 - wordmark) * 20})">${textElement(960, 620, "GLIMMERVOID", { size: 84, weight: 700, fill: COLOR.textHead, anchor: "middle", spacing: 8.4 })}</g>` +
    `<g opacity="${tagline}" transform="translate(0 ${(1 - tagline) * 20})">${textElement(960, 720, "Draw me like one of your French agents.", { size: 44, fill: COLOR.text, anchor: "middle" })}</g>` +
    `<g opacity="${link}" transform="translate(0 ${(1 - link) * 20})">${textElement(960, 800, "glimmervoid.dev", { size: 44, weight: 700, fill: COLOR.accent, anchor: "middle" })}</g>`;
}

const stage = document.getElementById("stage");
const STAGE_DEFS = `<defs>${GLYPH_DEFS}<linearGradient id="traffic-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${COLOR.accent}" stop-opacity="0.28"/><stop offset="1" stop-color="${COLOR.accent}" stop-opacity="0"/></linearGradient><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.8" fill="${COLOR.borderHover}"/></pattern>` +
  `<clipPath id="pane-clip"><rect x="${PANE.x}" y="${PANE.bodyY}" width="${PANE.width}" height="${PANE.bodyHeight}"/></clipPath>` +
  `<clipPath id="terminal-clip"><rect x="${TERMINAL.x}" y="${TERMINAL.y + HEADER_HEIGHT}" width="${TERMINAL.openWidth}" height="${TERMINAL.height - HEADER_HEIGHT}"/></clipPath></defs>`;

function renderAt(realSeconds) {
  const clampedReal = Math.min(realSeconds, window.totalSeconds - 0.001);
  const time = Math.min(storyTimeAt(clampedReal), TIMELINE.total - 0.001);
  stage.innerHTML = STAGE_DEFS + `<rect width="1920" height="1080" fill="${COLOR.bg}"/>` +
    `<g opacity="${lerp(1, SCENE_DIM_OPACITY, sceneDimAt(clampedReal))}">${drawDashboard(time)}</g>` + drawTitleCards(clampedReal) + drawEndCard(time);
}

let isPlaying = false;
let currentTime = 0;
let lastFrameMs = 0;

const NARRATION_DRIFT_SECONDS = 0.12;
const VOLUME_STORAGE_KEY = "explainer-volume";

const narration = document.getElementById("narration");
const soundHint = document.getElementById("sound-hint");
const volumeSlider = document.getElementById("volume");
let isNarrationBlocked = false;

function readStoredVolume() {
  try {
    const stored = localStorage.getItem(VOLUME_STORAGE_KEY);
    return stored === null ? 0.8 : Number(stored);
  } catch {
    return 0.8;
  }
}

function applyVolume(volume) {
  narration.volume = Math.min(1, Math.max(0, volume));
  volumeSlider.value = String(narration.volume);
  try {
    localStorage.setItem(VOLUME_STORAGE_KEY, String(narration.volume));
  } catch {}
}

function isNarrationAudible() {
  return !narration.paused && !narration.seeking;
}

function syncNarration() {
  if (!isPlaying) {
    narration.pause();
    return;
  }
  if (Math.abs(narration.currentTime - currentTime) > NARRATION_DRIFT_SECONDS) narration.currentTime = currentTime;
  if (!narration.paused || isNarrationBlocked) return;
  narration.play().then(() => { soundHint.hidden = true; }).catch(() => {
    isNarrationBlocked = true;
    soundHint.hidden = false;
  });
}

function unblockNarration() {
  isNarrationBlocked = false;
  syncNarration();
}

function wireNarrationControls() {
  applyVolume(readStoredVolume());
  volumeSlider.addEventListener("input", () => applyVolume(Number(volumeSlider.value)));
  document.addEventListener("click", unblockNarration);
  document.addEventListener("keydown", unblockNarration);
}

function showTime(seconds) {
  currentTime = ((seconds % window.totalSeconds) + window.totalSeconds) % window.totalSeconds;
  renderAt(currentTime);
  syncNarration();
}

function setPlaying(shouldPlay) {
  isPlaying = shouldPlay;
  lastFrameMs = performance.now();
  syncNarration();
  if (isPlaying) requestAnimationFrame(tick);
}

function tick(nowMs) {
  if (!isPlaying) return;
  const elapsedSeconds = (nowMs - lastFrameMs) / 1000;
  lastFrameMs = nowMs;
  const nextTime = isNarrationAudible() ? narration.currentTime : currentTime + elapsedSeconds;
  if (nextTime >= window.totalSeconds - 0.02) {
    showTime(0);
    narration.currentTime = 0;
  }
  if (nextTime < window.totalSeconds - 0.02) {
    currentTime = nextTime;
    renderAt(currentTime);
  }
  requestAnimationFrame(tick);
}

const stillMatch = location.hash.match(/^#t([\d.]+)$/);
const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
wireNarrationControls();
document.getElementById("pause").addEventListener("click", (event) => { event.stopPropagation(); setPlaying(!isPlaying); });
document.getElementById("restart").addEventListener("click", (event) => { event.stopPropagation(); showTime(0); setPlaying(true); });
if (stillMatch) renderAt(realTimeAt(Number(stillMatch[1])));
if (!stillMatch && prefersReducedMotion) renderAt(realTimeAt(TIMELINE.planLandedLine + 0.4));
if (!stillMatch && !prefersReducedMotion) { showTime(0); setPlaying(true); }
</script>
</body>
</html>
