<!doctype html>
<html lang="en" data-template="hook">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: var(--canvas-width, 600px); height: var(--canvas-height, 315px); overflow: hidden; }
body {
  background: var(--brand-background);
  color: var(--brand-ink); font-family: var(--brand-body-family), monospace; font-weight: var(--brand-body-weight, 400);
}
main { position: absolute; inset: 0 var(--safe-right) 0 var(--safe-left); padding-top: calc(var(--canvas-height) * .06); display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--canvas-height) * .05); }
p, h1 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--brand-display-family), monospace; font-weight: var(--brand-display-weight, 700); font-size: calc(var(--min-text-size) * 2.4); line-height: .9; letter-spacing: .06em; text-transform: uppercase; text-align: left; }
h1 span { display: block; width: fit-content; }
h1 .void { position: relative; }
h1 .void::after { content: ""; position: absolute; left: calc(100% + .3em); top: 36%; width: .24em; height: .24em; rotate: 45deg; background: var(--brand-accent); }
.subline { font-size: calc(var(--min-text-size) * 1.15); line-height: 1.3; color: var(--brand-ink); }
.window {
  position: absolute; left: 50%; bottom: calc(var(--canvas-height) * -.06); transform: translateX(-50%);
  width: 500px; border: 1px solid #2a2440; border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 40px -8px color-mix(in srgb, var(--brand-accent) 45%, transparent);
}
.window img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<main>
<h1><span>Glimmer</span><span class="void">void</span></h1>
<p class="subline" data-slot="subline"></p>
</main>
<div class="window"><img data-slot="image" alt=""></div>
</body>
</html>
