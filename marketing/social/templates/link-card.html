<!doctype html>
<html lang="en" data-template="hook">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: var(--canvas-width, 600px); height: var(--canvas-height, 315px); overflow: hidden; }
body {
  background: radial-gradient(ellipse 70% 60% at 50% 100%, color-mix(in srgb, var(--brand-accent) 22%, transparent), transparent 70%), var(--brand-background);
  color: var(--brand-ink); font-family: var(--brand-body-family), monospace; font-weight: var(--brand-body-weight, 400);
}
main { position: absolute; inset: 0 var(--safe-right) 0 var(--safe-left); padding-top: calc(var(--canvas-height) * .075); display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--canvas-height) * .03); }
p, h1 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: var(--min-text-size); letter-spacing: .14em; text-transform: uppercase; color: var(--brand-accent); }
h1 { font-family: var(--brand-display-family), monospace; font-weight: var(--brand-display-weight, 700); font-size: calc(var(--min-text-size) * 1.6); line-height: 1.08; letter-spacing: -0.02em; }
h1 em { font-style: normal; color: var(--brand-accent); }
.subline { font-size: var(--min-text-size); line-height: 1.3; color: color-mix(in srgb, var(--brand-ink) 78%, var(--brand-background)); }
.window {
  position: absolute; left: 50%; bottom: calc(var(--canvas-height) * -.06); transform: translateX(-50%);
  width: 500px; border: 1px solid #2a2440; border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 40px -8px color-mix(in srgb, var(--brand-accent) 45%, transparent);
}
.window img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<main>
<p class="eyebrow" data-slot="eyebrow"></p>
<h1>Mission control <em>that ships</em>.</h1>
<p class="subline" data-slot="subline"></p>
</main>
<div class="window"><img data-slot="image" alt=""></div>
</body>
</html>
