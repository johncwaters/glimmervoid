<h2 class="dialog-title" id="add-session-title">New session</h2>
<p class="add-session-sentence">Start <span class="add-session-word add-session-agent-word"><span class="agent-mark" id="add-session-agent-mark" aria-hidden="true" hidden></span><select class="add-session-word-select" id="add-session-agent" aria-label="Agent"></select></span> in <span id="add-session-repo-word-slot"></span><span class="add-session-place" id="add-session-place" hidden> on <span class="add-session-word"><select class="add-session-word-select" id="add-session-place-select" aria-label="Where it runs"></select></span></span></p>
<input type="text" class="dialog-input add-session-task" id="add-session-task" placeholder="Add a task (optional)" maxlength="4000" autocomplete="off" aria-label="Task">
<div class="add-session-pick" id="add-session-pick">
  <input type="text" class="dialog-input add-session-find" id="add-session-find" placeholder="Find a project" autocomplete="off" spellcheck="false" aria-label="Find a project">
  <div class="add-session-list" id="add-session-list" role="listbox" aria-label="Projects"></div>
  <div class="dialog-repo-roots" id="add-session-repo-roots" hidden>
    <p class="dialog-repo-roots-title" id="add-session-repo-roots-title">No repository roots yet</p>
    <p class="dialog-repo-roots-desc">Add the folder that holds your git checkouts. Its repos show up right here.</p>
  </div>
</div>
<div class="add-session-panel" id="add-session-workspace" hidden>
  <div id="add-session-workspace-back-slot"></div>
  <fieldset class="dialog-workspace-list" id="add-session-workspace-list" aria-label="Workspace repositories"></fieldset>
</div>
<div class="add-session-panel" id="add-session-folder" hidden>
  <div id="add-session-folder-back-slot"></div>
  <input type="text" class="dialog-input" id="add-session-path" placeholder="Full path to the folder" autocomplete="off" spellcheck="false" aria-label="Folder path">
</div>
<div class="dialog-label" id="add-session-agent-login" hidden>
  <span class="dialog-hint" id="add-session-agent-login-text"></span>
</div>
<p class="dialog-hint" id="add-session-environment-hint" hidden></p>
<p class="dialog-hint" id="add-session-unprotected" hidden></p>
<div class="dialog-error" id="add-session-error"></div>
<div class="dialog-actions" id="add-session-actions"></div>
