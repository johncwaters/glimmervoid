<h2 class="dialog-title" id="add-session-title">Add Session</h2>
<div class="dialog-mode-controls" role="group" aria-label="Session kind">
  <button type="button" class="dialog-mode-button" id="add-session-single-mode" aria-pressed="true">Single repo</button>
  <button type="button" class="dialog-mode-button" id="add-session-workspace-mode" aria-pressed="false">Workspace</button>
</div>
<label class="dialog-label" id="add-session-picker-label">
  Pick a project:
  <select class="dialog-input project-picker" id="add-session-picker">
    <option value="" disabled selected>Scanning...</option>
  </select>
</label>
<div class="dialog-workspace-list" id="add-session-workspace-list" role="group" aria-label="Workspace repositories" hidden></div>
<label class="dialog-label" id="add-session-agent-label" hidden>
  Agent
  <select class="dialog-input" id="add-session-agent"></select>
</label>
<button type="button" class="dialog-advanced-toggle" id="add-session-advanced-toggle">Advanced options</button>
<div class="dialog-advanced-panel" id="add-session-advanced" hidden>
  <label class="dialog-label">
    Name
    <input type="text" class="dialog-input" id="add-session-name" placeholder="my-project" autocomplete="off" spellcheck="false">
  </label>
  <label class="dialog-label" id="add-session-path-label">
    Path
    <input type="text" class="dialog-input" id="add-session-path" placeholder="C:\Users\...\my-project" autocomplete="off" spellcheck="false">
  </label>
</div>
<label class="dialog-label dialog-checkbox-label" id="add-session-require-perms-label">
  <input type="checkbox" class="dialog-checkbox" id="add-session-require-perms">
  <span>Require permission prompts</span>
  <span class="dialog-hint">Sessions run without permission prompts by default. Check this to make the agent ask before file writes and shell commands.</span>
</label>
<div class="dialog-error" id="add-session-error"></div>
<div class="dialog-actions">
  <button class="btn-dialog btn-dialog-cancel" id="add-session-cancel">Cancel</button>
  <button class="btn-dialog btn-dialog-confirm" id="add-session-confirm">Add</button>
</div>
