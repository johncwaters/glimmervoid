<h2 class="dialog-title" id="add-session-title">What are we working on?</h2>
<p class="add-session-sentence">Start <span id="add-session-agent-word-slot"></span> as <span id="add-session-account-word-slot"></span> on <span id="add-session-model-word-slot"></span> in <span id="add-session-repo-word-slot"></span></p>
<fieldset class="add-session-launchers" id="add-session-launchers" aria-label="Pack launchers" hidden></fieldset>
<div class="add-session-pick" id="add-session-pick">
  <div class="add-session-top">
    <p class="add-session-slot-title" id="add-session-slot-title"></p>
    <input type="text" class="dialog-input add-session-find" id="add-session-find" placeholder="Find a project, or #128 for an issue" autocomplete="off" spellcheck="false" aria-label="Find a project, or #128 for an issue">
  </div>
  <div class="add-session-list" id="add-session-list" role="listbox" aria-label="Projects"></div>
  <div class="dialog-repo-roots" id="add-session-repo-roots" hidden>
    <p class="dialog-repo-roots-title" id="add-session-repo-roots-title">Add a repository</p>
    <p class="dialog-repo-roots-desc">Add the folder that holds your git checkouts. Its repos show up right here.</p>
  </div>
</div>
<div class="add-session-panel" id="add-session-workspace" hidden>
  <div class="add-session-top">
    <input type="text" class="dialog-input add-session-find" id="add-session-workspace-find" placeholder="Find a repository" autocomplete="off" spellcheck="false" aria-label="Find a repository">
  </div>
  <div class="add-session-list" id="add-session-workspace-list" role="listbox" aria-multiselectable="true" aria-label="Workspace repositories"></div>
</div>
<div class="add-session-panel" id="add-session-folder" hidden>
  <div class="add-session-top">
    <input type="text" class="dialog-input" id="add-session-path" placeholder="Full path to the folder" autocomplete="off" spellcheck="false" aria-label="Folder path">
  </div>
  <div class="add-session-list" id="add-session-folder-list" role="listbox" aria-label="Folder"></div>
</div>
<p class="dialog-hint" id="add-session-sign-in" role="status" hidden></p>
<p class="dialog-hint" id="add-session-unprotected" hidden></p>
<div class="dialog-error add-session-message" id="add-session-error"></div>
<div class="dialog-actions add-session-actions" id="add-session-actions"></div>
