<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="./fonts/commit-mono-400-regular-core.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/commit-mono-700-regular-core.woff2" as="font" type="font/woff2" crossorigin>
  <title>Glimmervoid</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg, #0a0810);
      color: var(--text, #c8c0e0);
      font-family: var(--font-mono, 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace);
    }

    .app-shell { display: none; }
    html:not([data-layout="phone"]) .app-ready .app-shell { display: contents; }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0a0810;
      transition: opacity 300ms ease;
    }

    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #e8e0ff;
      text-transform: uppercase;
    }

    .loading-screen .loading-title {
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .loading-screen[data-unlock="lit"] .loading-title,
    .loading-screen[data-unlock="burst"] .loading-title {
      opacity: 1;
    }

    .loading-screen[data-unlock] .loading-status,
    .loading-screen[data-unlock] .loading-detail {
      opacity: 0;
      transition: opacity 200ms ease;
    }

    .loading-mark {
      width: 72px;
      height: 72px;
      overflow: visible;
    }

    .loading-mark-dial,
    .loading-mark-light,
    .loading-mark-halo {
      transform-origin: 50px 50px;
    }

    .loading-mark-bracket {
      fill: none;
      stroke: #e8e0ff;
      stroke-width: 11;
      stroke-linejoin: miter;
      stroke-linecap: butt;
    }

    .loading-mark-bracket[data-side="top"] { --dx: 0; --dy: 1; }
    .loading-mark-bracket[data-side="right"] { --dx: -1; --dy: 0; }
    .loading-mark-bracket[data-side="bottom"] { --dx: 0; --dy: -1; animation-delay: 650ms; }
    .loading-mark-bracket[data-side="left"] { --dx: 1; --dy: 0; animation-delay: 975ms; }
    .loading-mark-bracket[data-side="right"] { animation-delay: 325ms; }

    .loading-mark-light {
      fill: #c084fc;
      transform: scale(0);
    }

    .loading-mark-halo {
      fill: none;
      stroke: #c084fc;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      opacity: 0;
    }

    @media (prefers-reduced-motion: no-preference) {
      .loading-mark-bracket {
        animation: loading-mark-scan 1.3s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    }

    .loading-screen[data-unlock] .loading-mark-bracket,
    .shutdown-screen:not(.active) .loading-mark-bracket,
    .shutdown-screen.done .loading-mark-bracket {
      animation: none;
    }

    @keyframes loading-mark-scan {
      0%, 30%, 100% { transform: none; stroke: #e8e0ff; }
      12% { transform: translate(calc(var(--dx) * 6px), calc(var(--dy) * 6px)); stroke: #c084fc; }
    }

    .loading-status {
      font-family: 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      color: #8276b0;
    }

    .loading-detail {
      max-width: min(34ch, calc(100vw - 32px));
      margin-top: -8px;
      font-family: 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #5e5584;
      text-align: center;
      text-wrap: balance;
    }

    .shutdown-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10, 8, 16, 0);
      backdrop-filter: blur(0px);
      pointer-events: none;
      opacity: 0;
      transition: background 400ms ease, backdrop-filter 400ms ease, opacity 300ms ease;
    }

    .shutdown-screen.active {
      background: rgba(10, 8, 16, 0.92);
      backdrop-filter: blur(8px);
      pointer-events: auto;
      opacity: 1;
    }

    .shutdown-status {
      font-family: 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      color: #8276b0;
      transition: color 300ms ease;
    }

    .shutdown-screen.done .loading-mark {
      opacity: 0.3;
    }

    .shutdown-screen.done .shutdown-status {
      color: #4a4268;
    }
  </style>
</head>
<body>
  <a class="sr-only skip-link" href="#app-main">Skip to main content</a>
  <div class="loading-screen" id="loading-screen">
    <svg class="loading-mark" viewBox="-4 -4 108 108" aria-hidden="true">
      <path class="loading-mark-halo" d="M50 39L61 50L50 61L39 50Z"/>
      <g class="loading-mark-dial">
        <path class="loading-mark-bracket" data-side="top" d="M33 29L50 12L67 29"/>
        <path class="loading-mark-bracket" data-side="right" d="M71 33L88 50L71 67"/>
        <path class="loading-mark-bracket" data-side="bottom" d="M67 71L50 88L33 71"/>
        <path class="loading-mark-bracket" data-side="left" d="M29 67L12 50L29 33"/>
      </g>
      <path class="loading-mark-light" d="M50 39L61 50L50 61L39 50Z"/>
    </svg>
    <div class="loading-title">Glimmervoid</div>
    <div class="loading-status" id="loading-status">Connecting to server...</div>
    <div class="loading-detail" id="loading-detail" hidden></div>
  </div>

  <div class="shutdown-screen" id="shutdown-screen">
    <svg class="loading-mark" viewBox="-4 -4 108 108" aria-hidden="true">
      <path class="loading-mark-halo" d="M50 39L61 50L50 61L39 50Z"/>
      <g class="loading-mark-dial">
        <path class="loading-mark-bracket" data-side="top" d="M33 29L50 12L67 29"/>
        <path class="loading-mark-bracket" data-side="right" d="M71 33L88 50L71 67"/>
        <path class="loading-mark-bracket" data-side="bottom" d="M67 71L50 88L33 71"/>
        <path class="loading-mark-bracket" data-side="left" d="M29 67L12 50L29 33"/>
      </g>
      <path class="loading-mark-light" d="M50 39L61 50L50 61L39 50Z"/>
    </svg>
    <div class="loading-title">Glimmervoid</div>
    <div class="shutdown-status" id="shutdown-status">Shutting down sessions...</div>
  </div>

  <div class="app-shell">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-brand">
            <h1 class="header-title">Glimmervoid</h1>
            <div class="status-indicator" id="status-indicator">
              <span class="header-connection" id="connection-status" role="status" aria-label="Server connection">
                <span class="connection-dot"></span>
                <span class="connection-label">Connecting</span>
              </span>
            </div>
          </div>
          <div class="header-tabs" id="header-tabs" role="tablist" aria-label="Primary views">
          </div>
        </div>
        <div class="header-right">
          <div class="celebration-tray" id="celebration-tray" data-state="empty">
            <button class="btn-celebrations" id="btn-celebrations" type="button" title="Play queued merge celebrations" aria-label="Play queued merge celebrations"><svg class="btn-celebrations-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path d="M4.5 2h7v3.5a3.5 3.5 0 0 1-7 0z" /><path d="M4.5 3.5H2.5a2 2 0 0 0 2 2.5" /><path d="M11.5 3.5h2a2 2 0 0 1-2 2.5" /><path d="M8 9v3" /><path d="M5.5 14h5" /></svg></button>
            <span class="celebration-tray-count" id="celebration-tray-count" aria-live="polite"></span>
          </div>
          <button class="btn-add-header" id="btn-add-session-header" type="button" title="Add a new session">+ Session</button>
          <button class="btn-help" id="btn-help" type="button" title="Keyboard shortcuts" aria-label="Keyboard shortcuts and version">?</button>
          <button class="btn-mute" id="btn-mute" type="button" title="Mute alerts" aria-label="Mute alerts" aria-pressed="false">&#9834;</button>
          <button class="btn-streamer" id="btn-streamer" type="button" title="Streamer mode" aria-label="Streamer mode" aria-pressed="false"><svg class="btn-streamer-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><rect x="1.5" y="3" width="13" height="8.5" rx="1" /><path d="M5.5 14h5" /><path d="M8 11.5V14" /></svg></button>
          <div class="header-menu" id="power-menu">
            <button class="btn-menu btn-power" id="btn-power" type="button" title="Server power" aria-label="Server power" aria-haspopup="menu" aria-expanded="false" aria-controls="power-menu-dropdown"><svg class="btn-power-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path d="M8 1.5v6" /><path d="M4.4 3.6a5.5 5.5 0 1 0 7.2 0" /></svg></button>
            <div class="header-menu-dropdown" id="power-menu-dropdown" role="menu">
              <button class="menu-item menu-item-warning" id="btn-restart" type="button" role="menuitem"><span class="menu-item-glyph">&#8634;</span>Restart Server</button>
              <div class="menu-divider" id="menu-divider-shutdown"></div>
              <button class="menu-item menu-item-danger" id="btn-shutdown" type="button" role="menuitem"><span class="menu-item-glyph">&#9632;</span>Shut Down</button>
            </div>
          </div>
        </div>
      </div>
      <p class="header-status flex items-center gap-3 m-0 text-meta text-state-failed" id="header-status" role="status" hidden><span class="header-status-text" id="header-status-text"></span><span class="header-status-age shrink-0 text-text-muted" id="header-status-age"></span><button class="btn-dialog shrink-0" id="header-status-dismiss" type="button">Dismiss</button></p>
    </header>
    <div class="update-banner" id="update-banner" role="status" hidden>
      <span class="update-banner-text" id="update-banner-text"></span>
      <a class="update-banner-link" id="update-banner-link" href="https://github.com/johncwaters/glimmervoid/releases" target="_blank" rel="noopener noreferrer" hidden>View changes</a>
      <a class="update-banner-link" id="update-banner-update" href="#settings/machine-updates/update-actions" hidden>Update</a>
      <button class="update-banner-copy" id="update-banner-restart" type="button" hidden>Restart</button>
      <code class="update-banner-cmd" id="update-banner-cmd"></code>
      <button class="update-banner-copy" id="update-banner-copy" type="button">Copy</button>
      <span class="update-banner-copy-status" id="update-banner-copy-status" role="status"></span>
      <button class="update-banner-dismiss" id="update-banner-dismiss" type="button" aria-label="Dismiss update notice">&times;</button>
    </div>
    <div class="update-banner post-turn-leftovers-banner" id="post-turn-leftovers-banner" role="status" hidden>
      <span class="update-banner-text" id="post-turn-leftovers-text"></span>
      <code class="update-banner-cmd post-turn-leftovers-cmd" id="post-turn-leftovers-cmd"></code>
      <button class="update-banner-copy" id="post-turn-leftovers-copy" type="button">Copy</button>
      <span class="update-banner-copy-status" id="post-turn-leftovers-copy-status" role="status"></span>
      <button class="update-banner-dismiss" id="post-turn-leftovers-dismiss" type="button" aria-label="Dismiss old report notice">&times;</button>
    </div>
    <div class="update-banner" id="telemetry-banner" role="status" hidden>
      <span class="telemetry-banner-cat" aria-hidden="true"></span>
      <span class="update-banner-text">Glimmervoid collects usage data to help us improve it. No prompts or project information are collected.</span>
      <a class="update-banner-link" id="telemetry-banner-settings" href="#settings/privacy/telemetry-enabled">What's collected</a>
      <button class="update-banner-copy telemetry-banner-dismiss" id="telemetry-banner-dismiss" type="button">Dismiss</button>
    </div>
    <div class="app-body" id="app-body">
      <main class="app-main" id="app-main" tabindex="-1">
        <section class="sessions" id="sessions-container">
        </section>
        <section class="focus-view" id="view-focus" role="tabpanel" aria-labelledby="tab-focus" hidden>
          <div class="focus-rail" id="focus-rail" role="listbox" aria-label="Session roster" aria-keyshortcuts="ArrowUp ArrowDown Alt+ArrowUp Alt+ArrowDown"></div>
          <hr class="focus-rail-resizer" id="focus-rail-resizer" aria-orientation="vertical" aria-label="Resize session rail" aria-valuenow="240" tabindex="0">
          <div class="focus-center" id="focus-center"></div>
        </section>
      </main>
      <aside class="app-sidebar" id="review-sidebar" aria-label="Session review"></aside>
    </div>
    <div id="health-footer-mount"></div>
  </div>
  <script type="module" src="/app.ts"></script>
</body>
</html>
