<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Glimmervoid</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg, #0a0810);
      color: var(--text, #c8c0e0);
      font-family: var(--font-mono, 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace);
    }

    .app-shell { display: none; }
    html:not([data-layout="phone"]) .app-ready .app-shell { display: contents; }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #0a0810;
      transition: opacity 300ms ease;
    }

    .loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-title {
      font-family: 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #e8e0ff;
      text-transform: uppercase;
    }

    .loading-title::before {
      content: '\25b8 ';
      color: #c084fc;
    }

    .loading-status {
      font-family: 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      color: #8276b0;
      letter-spacing: 0.04em;
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #2a2440;
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .shutdown-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10, 8, 16, 0);
      backdrop-filter: blur(0px);
      pointer-events: none;
      opacity: 0;
      transition: background 400ms ease, backdrop-filter 400ms ease, opacity 300ms ease;
    }

    .shutdown-screen.active {
      background: rgba(10, 8, 16, 0.92);
      backdrop-filter: blur(8px);
      pointer-events: auto;
      opacity: 1;
    }

    .shutdown-status {
      font-family: 'CommitMono', 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
      font-size: 12px;
      color: #8276b0;
      letter-spacing: 0.04em;
      transition: color 300ms ease;
    }

    .shutdown-screen.done .loading-spinner {
      animation: none;
      border-color: #2a2440;
      border-top-color: #2a2440;
      opacity: 0.3;
    }

    .shutdown-screen.done .shutdown-status {
      color: #4a4268;
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loading-screen">
    <div class="loading-title">Glimmervoid</div>
    <div class="loading-spinner"></div>
    <div class="loading-status" id="loading-status">Connecting to server...</div>
  </div>

  <div class="shutdown-screen" id="shutdown-screen">
    <div class="loading-title">Glimmervoid</div>
    <div class="loading-spinner"></div>
    <div class="shutdown-status" id="shutdown-status">Shutting down sessions...</div>
  </div>

  <div class="app-shell">
    <header class="header">
      <div class="header-inner">
        <div class="header-left">
          <div class="header-brand">
            <h1 class="header-title">Glimmervoid</h1>
            <div class="status-indicator" id="status-indicator">
              <span class="header-connection" id="connection-status" role="status" aria-label="Server connection">
                <span class="connection-dot"></span>
                <span class="connection-label">Connecting</span>
              </span>
            </div>
          </div>
          <div class="header-tabs" id="header-tabs" role="tablist" aria-label="Primary views">
            <button class="header-tab" id="tab-focus" type="button" role="tab" aria-selected="true" aria-controls="view-focus" tabindex="0">Focus</button>
            <button class="header-tab" id="tab-calm" type="button" role="tab" aria-selected="false" aria-controls="view-calm" tabindex="-1" hidden>Calm</button>
            <button class="header-tab" id="tab-prs" type="button" role="tab" aria-selected="false" aria-controls="view-prs" tabindex="-1">Reviews<span class="tab-activity" id="tab-prs-activity" aria-hidden="true"></span></button>
            <button class="header-tab" id="tab-issues" type="button" role="tab" aria-selected="false" aria-controls="view-issues" tabindex="-1">Issues</button>
            <button class="header-tab" id="tab-usage" type="button" role="tab" aria-selected="false" aria-controls="view-usage" tabindex="-1">Usage<span class="tab-activity" id="tab-usage-activity" aria-hidden="true"></span></button>
            <button class="header-tab" id="tab-radar" type="button" role="tab" aria-selected="false" aria-controls="view-radar" tabindex="-1">Radar<span class="tab-activity" id="tab-radar-activity" aria-hidden="true"></span></button>
            <button class="header-tab" id="tab-visions" type="button" role="tab" aria-selected="false" aria-controls="view-visions" tabindex="-1">Visions<span class="tab-activity" id="tab-visions-activity" aria-hidden="true"></span></button>
            <button class="header-tab" id="tab-hooks" type="button" role="tab" aria-selected="false" aria-controls="view-hooks" tabindex="-1">Hooks</button>
            <button class="header-tab" id="tab-trace" type="button" role="tab" aria-selected="false" aria-controls="view-trace" tabindex="-1">Trace</button>
            <button class="header-tab" id="tab-benchmarks" type="button" role="tab" aria-selected="false" aria-controls="view-benchmarks" tabindex="-1" hidden>Bench</button>
            <button class="header-tab" id="tab-factory" type="button" role="tab" aria-selected="false" aria-controls="view-factory" tabindex="-1" hidden>Factory</button>
            <button class="header-tab" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="view-settings" tabindex="-1">Settings</button>
          </div>
        </div>
        <div class="header-right">
          <span class="header-aggregate" id="aggregate-status" role="status" aria-live="polite"></span>
          <button class="btn-add-header" id="btn-add-session-header" type="button" title="Add a new session">+ Session</button>
          <button class="btn-help" id="btn-help" type="button" title="Keyboard shortcuts" aria-label="Keyboard shortcuts and version">?</button>
          <button class="btn-mute" id="btn-mute" type="button" title="Mute alerts" aria-label="Mute alerts" aria-pressed="false">&#9834;</button>
          <div class="header-menu" id="power-menu">
            <button class="btn-menu btn-power" id="btn-power" type="button" title="Server power" aria-label="Server power" aria-haspopup="menu" aria-expanded="false" aria-controls="power-menu-dropdown"><svg class="btn-power-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path d="M8 1.5v6" /><path d="M4.4 3.6a5.5 5.5 0 1 0 7.2 0" /></svg></button>
            <div class="header-menu-dropdown" id="power-menu-dropdown" role="menu">
              <button class="menu-item menu-item-warning" id="btn-restart" type="button" role="menuitem"><span class="menu-item-glyph">&#8634;</span>Restart Server</button>
              <div class="menu-divider" id="menu-divider-shutdown"></div>
              <button class="menu-item menu-item-danger" id="btn-shutdown" type="button" role="menuitem"><span class="menu-item-glyph">&#9632;</span>Shut Down</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div class="update-banner" id="update-banner" role="status" hidden>
      <span class="update-banner-text" id="update-banner-text"></span>
      <a class="update-banner-link" id="update-banner-link" href="https://github.com/johncwaters/glimmervoid/releases" target="_blank" rel="noopener noreferrer" hidden>View changes</a>
      <a class="update-banner-link" id="update-banner-update" href="#settings/machine-updates/update-actions" hidden>Update</a>
      <code class="update-banner-cmd" id="update-banner-cmd"></code>
      <button class="update-banner-copy" id="update-banner-copy" type="button">Copy</button>
      <span class="update-banner-copy-status" id="update-banner-copy-status" role="status"></span>
      <button class="update-banner-dismiss" id="update-banner-dismiss" type="button" aria-label="Dismiss update notice">&times;</button>
    </div>
    <div class="update-banner" id="telemetry-banner" role="status" hidden>
      <span class="update-banner-text">Glimmervoid sends anonymous usage and error data to help improve it. No paths, prompts or terminal output.</span>
      <a class="update-banner-link" id="telemetry-banner-settings" href="#settings/privacy/telemetry-enabled">Open settings</a>
      <button class="update-banner-copy telemetry-banner-dismiss" id="telemetry-banner-dismiss" type="button">Dismiss</button>
    </div>
    <div class="app-body" id="app-body">
      <main class="app-main" id="app-main">
        <section class="sessions" id="sessions-container">
        </section>
        <section class="calm-view" id="view-calm" role="tabpanel" aria-labelledby="tab-calm" hidden></section>
        <section class="radar-view" id="view-radar" role="tabpanel" aria-labelledby="tab-radar" hidden></section>
        <section class="pr-view" id="view-prs" role="tabpanel" aria-labelledby="tab-prs" hidden></section>
        <section class="issues-view" id="view-issues" role="tabpanel" aria-labelledby="tab-issues" hidden></section>
        <section class="usage-view" id="view-usage" role="tabpanel" aria-labelledby="tab-usage" hidden></section>
        <section class="visions-view" id="view-visions" role="tabpanel" aria-labelledby="tab-visions" hidden></section>
        <section class="hooks-view" id="view-hooks" role="tabpanel" aria-labelledby="tab-hooks" hidden></section>
        <section class="trace-view" id="view-trace" role="tabpanel" aria-labelledby="tab-trace" hidden></section>
        <section class="bench-view" id="view-benchmarks" role="tabpanel" aria-labelledby="tab-benchmarks" hidden></section>
        <section class="factory-floor" id="view-factory" role="tabpanel" aria-labelledby="tab-factory" hidden></section>
        <section class="settings-view" id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
        <section class="focus-view" id="view-focus" role="tabpanel" aria-labelledby="tab-focus" hidden>
          <div class="focus-rail" id="focus-rail" role="listbox" aria-label="Session roster" aria-keyshortcuts="ArrowUp ArrowDown Alt+ArrowUp Alt+ArrowDown"></div>
          <hr class="focus-rail-resizer" id="focus-rail-resizer" aria-orientation="vertical" aria-label="Resize session rail" aria-valuenow="240" tabindex="0">
          <div class="focus-center" id="focus-center"></div>
        </section>
      </main>
      <aside class="app-sidebar" id="review-sidebar" aria-label="Session review"></aside>
    </div>
    <div id="health-footer-mount"></div>
  </div>
  <script type="module" src="/app.ts"></script>
</body>
</html>
